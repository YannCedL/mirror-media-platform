<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR — Media & Forensics Platform 360°</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0914;
            --card-bg: rgba(24, 18, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #ec4899;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 0%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #ec4899, #be185d);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
        }

        .logo-title { font-size: 1.4rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🪞</div>
            <div>
                <div class="logo-title">MIRROR</div>
                <div class="logo-subtitle">Plateforme Média, Verification & Forensics 360°</div>
            </div>
        </div>
        <div class="badge">MOTEURS CONNECTÉS (GHOST + CODEX)</div>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">Synthèse Forensics & Authenticité</div>
            <div class="info-row"><span class="info-label">Fichier Analysé</span><span class="info-val" id="mFile">-</span></div>
            <div class="info-row"><span class="info-label">Appareil Photo (EXIF)</span><span class="info-val" id="mCam">-</span></div>
            <div class="info-row"><span class="info-label">Verdict Forensics (ELA)</span><span class="info-val" id="mVerdict" style="color:#f472b6;">-</span></div>
        </div>

        <div class="card">
            <div class="card-title">Analyse OCR & Documents Récoltés</div>
            <div class="info-row"><span class="info-label">Volume de Mots</span><span class="info-val" id="mWords">-</span></div>
            <div class="info-row"><span class="info-label">Entités Détectées</span><span class="info-val" id="mEntities">-</span></div>
            <div class="info-row"><span class="info-label">Type de Document</span><span class="info-val" id="mDocType">-</span></div>
        </div>
    </div>

    <script>
        async function chargerMediaHub() {
            try {
                const response = await fetch('/api/v1/analyze?filepath=document_preuve.jpg');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('mFile').textContent = r.filepath || '-';
                document.getElementById('mCam').textContent = r.forensics_exif.camera_model || '-';
                document.getElementById('mVerdict').textContent = (r.forensics_ela.verdict || 'AUTHENTIQUE').toUpperCase();

                document.getElementById('mWords').textContent = r.document_analysis.word_count || '0';
                document.getElementById('mEntities').textContent = `SIREN: ${(r.document_analysis.entities.siren_found || []).join(', ')}`;
                document.getElementById('mDocType').textContent = r.document_analysis.entities.document_type || '-';

            } catch (err) {
                console.error("Erreur lors de l'analyse Media.");
            }
        }

        window.onload = chargerMediaHub;
    </script>
</body>
</html>
